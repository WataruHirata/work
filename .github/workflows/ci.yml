name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Application checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  requirements:
    name: Requirements traceability
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run harness tests
        run: python -m unittest discover -s tests -v

  database:
    name: Database migration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase
        run: supabase start -x studio,inbucket,edge-runtime,logflare,vector
      - name: Apply all migrations and seed data
        run: supabase db reset
      - name: Lint database schema
        run: supabase db lint --local --fail-on error

  deploy-production:
    name: Migrate database and deploy to Vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOY == 'true' && vars.APP_RELEASE_READY == 'true'
    needs: [harness, requirements, database]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify production deployment configuration
        shell: bash
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production environment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Link production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply reviewed database migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Pull Vercel production settings
        run: npm exec --yes --package=vercel@64.7.0 -- vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production deployment
        run: npm exec --yes --package=vercel@64.7.0 -- vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel production
        run: npm exec --yes --package=vercel@64.7.0 -- vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
